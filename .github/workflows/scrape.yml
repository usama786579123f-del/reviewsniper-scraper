    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      DB_NAME: reviewsniper

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium browser
        run: playwright install --with-deps chromium

      - name: Scrape ${{ matrix.query }}
        continue-on-error: true
        run: python lead_hunter.py --query "${{ matrix.query }}" --max-listings 30

      - name: Upload debug artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ strategy.job-index }}
          path: |
            debug_*.png
            debug_*.html
          if-no-files-found: ignore
