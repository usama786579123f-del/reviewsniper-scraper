name: ReviewSniper Lead Hunter

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      DB_NAME: reviewsniper

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium browser
        run: playwright install --with-deps chromium

      - name: Dubai - Dental Clinics
        continue-on-error: true
        run: python lead_hunter.py --query "Dental Clinics in Dubai" --max-listings 40

      - name: Dubai - Plastic Surgeons
        continue-on-error: true
        run: python lead_hunter.py --query "Plastic Surgeons in Dubai" --max-listings 40

      - name: Dubai - Luxury Car Rentals
        continue-on-error: true
        run: python lead_hunter.py --query "Luxury Car Rentals in Dubai" --max-listings 40

      - name: Dubai - Fine Dining Restaurants
        continue-on-error: true
        run: python lead_hunter.py --query "Fine Dining Restaurants in Dubai" --max-listings 40

      - name: USA - HVAC Miami
        continue-on-error: true
        run: python lead_hunter.py --query "HVAC AC Repair in Miami" --max-listings 40

      - name: USA - Personal Injury Lawyers Houston
        continue-on-error: true
        run: python lead_hunter.py --query "Personal Injury Lawyers in Houston" --max-listings 40

      - name: USA - Roofers Dallas
        continue-on-error: true
        run: python lead_hunter.py --query "Roofers in Dallas" --max-listings 40

      - name: USA - Dental Clinics Miami
        continue-on-error: true
        run: python lead_hunter.py --query "Dental Clinics in Miami" --max-listings 40

      - name: Upload debug screenshot (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_maps_screen.png
          if-no-files-found: ignore
